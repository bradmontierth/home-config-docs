# Drop-in: /etc/systemd/journald.conf.d/persistent.conf
#
# This box's journal was volatile: /var/log/journal existed but was empty and
# only the current boot was retained. That cost us the entire evidence trail
# from the 10-hour Powerwall AP lockout on 2026-07-30 -- every
# CTRL-EVENT-ASSOC-REJECT status_code=16 line was gone by the time we went
# looking. The failures worth diagnosing here are precisely the ones that end
# in a reboot or a power pull, so a journal that dies with the boot is useless.
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemMaxFileSize=20M
