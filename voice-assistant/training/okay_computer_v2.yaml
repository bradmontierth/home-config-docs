# okay_computer v2 (2026-09-01): the v1 recipe + the REAL corpus injected between
# generate and augment — see home_config/wake-retrain-plan.md and run_okay_computer_v2.sh.
# Real positives x10, real "okay-but-not-computer" negatives, real-room
# backgrounds (stage-1 false fires) both as background clips and in the mix.
model_name: okay_computer_v2
target_phrases: ["okay computer", "ok computer"]

n_samples: 25000
n_samples_val: 5000
n_background_samples: 2000
n_background_samples_val: 500
tts_batch_size: 32

# Adversarial negatives: bare keyword (the everyday-conversation risk),
# phonetic neighbors, and the sibling candidate so A/B cross-fire stays low.
custom_negative_phrases:
  - "computer"
  - "the computer"
  - "my computer"
  - "a computer"
  - "computers"
  - "on the computer"
  - "okay commuter"
  - "okay compute"
  - "okay computing"
  - "okay computed"
  - "okay come here"
  - "okay come over"
  - "okay copy that"
  - "okay come to"
  - "okay so"
  - "hey computer"

noise_scales: [0.98]
noise_scale_ws: [0.98]
length_scales: [0.75, 1.0, 1.25]
slerp_weights: [0.2, 0.35, 0.5, 0.65, 0.8]

data_dir: /work/data
output_dir: /work/output/okay_computer_v2

augmentation:
  clip_duration: 2.0
  batch_size: 16
  rounds: 3
  background_paths: [/work/data/backgrounds, /work/data/backgrounds_real]
  rir_paths: [/work/data/rirs]

model:
  model_type: conv_attention
  model_size: medium

steps: 100000
learning_rate: 0.0001
weight_decay: 0.01
label_smoothing: 0.05
max_negative_weight: 3000
target_fp_per_hour: 0.1

batch_n_per_class:
  positive: 50
  adversarial_negative: 50
  ACAV100M_sample: 1024
  background_noise: 50
