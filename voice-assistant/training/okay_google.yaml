# Wake word: "okay google" — transition phrase alongside okay_computer.
# Mirrors okay_computer.yaml (the 2026-07-06 bakeoff winner recipe).
# "hey google" deliberately NOT a negative: family habit may include it and
# we don't want to train active suppression. "okay computer" IS a negative
# so the two live stage-1 heads don't cross-fire.
model_name: okay_google
target_phrases: ["okay google", "ok google"]

n_samples: 25000
n_samples_val: 5000
n_background_samples: 2000
n_background_samples_val: 500
tts_batch_size: 32

# Adversarial negatives: bare keyword, phonetic neighbors, sibling wake word.
custom_negative_phrases:
  - "google"
  - "the google"
  - "on google"
  - "google it"
  - "googled"
  - "googling"
  - "okay good"
  - "okay go"
  - "okay cool"
  - "okay gould"
  - "okay girl"
  - "okay you go"
  - "okay let's go"
  - "okay gotcha"
  - "okay so"
  - "okay computer"

noise_scales: [0.98]
noise_scale_ws: [0.98]
length_scales: [0.75, 1.0, 1.25]
slerp_weights: [0.2, 0.35, 0.5, 0.65, 0.8]

data_dir: /work/data
output_dir: /work/output/okay_google

augmentation:
  clip_duration: 2.0
  batch_size: 16
  rounds: 3
  background_paths: [/work/data/backgrounds]
  rir_paths: [/work/data/rirs]

model:
  model_type: conv_attention
  model_size: medium

steps: 100000
learning_rate: 0.0001
weight_decay: 0.01
label_smoothing: 0.05
max_negative_weight: 3000
target_fp_per_hour: 0.1

batch_n_per_class:
  positive: 50
  adversarial_negative: 50
  ACAV100M_sample: 1024
