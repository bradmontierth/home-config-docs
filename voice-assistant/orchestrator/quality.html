<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Microphone comparison</title><style>
body{font:16px system-ui;max-width:1000px;margin:24px auto;padding:0 16px;background:#f5f6f8;color:#18212b}article{background:white;padding:20px;margin:18px 0;border-radius:12px}.pair{display:flex;gap:24px;flex-wrap:wrap}.candidate{flex:1;min-width:260px}audio{width:100%}button,select,input{font:inherit;padding:8px;margin:4px}input{width:260px}small{color:#536171}h2{font-size:18px}#status{margin-left:10px}
</style><h1>Microphone comparison</h1><p>Compare both recordings and label which microphone should win. Active selections appear below with their reason and added wait.</p><p>Higher scores (closer to zero) indicate greater decoder confidence. The ranking is experimental; it is not a probability of correctness.</p><button id="refresh">Refresh</button><span id="status"></span><main id="turns"></main><script>
const el=(tag,text,parent)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(parent)parent.append(n);return n};
const fmt=(n,d=3)=>typeof n==='number'?n.toFixed(d):'unavailable';
async function refresh(){const status=document.querySelector('#status');status.textContent='Loading…';try{const r=await fetch('/quality/recent');if(!r.ok)throw Error(r.status);const data=await r.json();const main=document.querySelector('#turns');main.replaceChildren();status.textContent=`${data.mode} · ${data.turns.length} recent turns`;for(const t of data.turns){const card=el('article',undefined,main);el('h2',new Date(t.at*1000).toLocaleString(),card);if(t.actual?.command)el('p',`Assistant used ${t.selection?.selected_sat||t.actual.sat}: ${t.actual.command} (${t.actual.asr_model||'ASR'}${t.actual.asr_fallback_reason&&t.actual.asr_fallback_reason!=='none'?', fallback: '+t.actual.asr_fallback_reason:''})`,card);if(t.selection)el('p',`Selected: ${t.selection.selected_sat} · ${t.selection.reason.replaceAll('_',' ')} · waited ${t.selection.wait_ms} ms`,card);el('p',`Score ranking: ${t.proposed_sat||'undecided'} · ${t.reason.replaceAll('_',' ')}`,card);if(t.shadow_ready_delta_ms!==undefined)el('small',`Shadow finished ${t.shadow_ready_delta_ms} ms relative to primary. Transcript agreement: ${fmt(t.agreement_ratio,0)}%.`,card);const pair=el('div',undefined,card);pair.className='pair';for(const c of t.candidates){const col=el('div',undefined,pair);col.className='candidate';el('h2',`${c.sat} · ${c.role==='primary'?'original winner':'shadow'}`,col);el('p',c.asr.transcript_text||c.error||'No transcript',col);const s=c.asr.summary||{};el('p',`Score: ${fmt(s.confidence)}${s.confidence_valid?'':' (not valid for comparison)'} · request: ${fmt(c.wall_ms,0)} ms`,col);el('small',`Command level contrast: ${fmt(c.level_contrast_db,1)} dB (estimated, not calibrated SNR)`,col);if(c.audio){const a=el('audio',undefined,col);a.controls=true;a.preload='none';a.src='/quality/audio/'+encodeURIComponent(c.audio)}}const form=el('form',undefined,card);const label=el('label','Expected winner: ',form);const select=el('select',undefined,label);for(const value of ['','kitchen','familyroom','either','neither']){const option=el('option',value||'Choose…',select);option.value=value}select.value=t.label?.expected_sat||'';const notes=el('input',undefined,form);notes.placeholder='Fan on, standing by sink…';notes.setAttribute('aria-label','Test conditions');notes.maxLength=1000;notes.value=t.label?.notes||'';const save=el('button','Save label',form);const message=el('small','',form);form.onsubmit=async e=>{e.preventDefault();if(!select.value)return;save.disabled=true;try{const r=await fetch(`/quality/${t.turn_id}/label`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expected_sat:select.value,notes:notes.value})});if(!r.ok)throw Error(r.status);message.textContent='Saved'}catch(e){message.textContent='Save failed: '+e.message}finally{save.disabled=false}}}}catch(e){status.textContent='Load failed: '+e.message}}
document.querySelector('#refresh').onclick=refresh;refresh();
</script></html>
