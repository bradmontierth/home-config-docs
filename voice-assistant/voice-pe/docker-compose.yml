services:
  esphome-voice-pe:
    image: ghcr.io/esphome/esphome:2026.7.4
    network_mode: host
    working_dir: /config
    volumes:
      - ./config:/config
      - ../..:/workspace:ro
      - /home/pi/esphome/config/secrets.yaml:/config/secrets.yaml:ro

  simon-voice-bridge:
    build: ./bridge
    container_name: simon-voice-bridge
    network_mode: host
    restart: unless-stopped
    # The stateless wake-word frontend recomputes a two-second feature window.
    # Bound it so this experimental satellite cannot monopolize the Beelink.
    cpus: "1.5"
    environment:
      DEVICE_HOST: 192.168.30.62
      DEVICE_PORT: "6053"
      DEVICE_NAME: simon-voice-pe
      SATELLITE_ID: simon
      ORCH_BASE: http://127.0.0.1:8785
      HTTP_PORT: "8793"
      # Come back ARMED after a rebuild or a host reboot. This was `shadow`,
      # which meant every container rebuild silently took Simon's room out of
      # voice service until somebody noticed and POSTed /mode — the worst
      # failure shape there is, because it stops working quietly and people
      # just stop using it (Brad, 2026-08-11).
      #
      # The safety property is NOT lost: active still requires the
      # ACTIVE_ARM_FILE (/data/routed-audio-armed) to exist, and the bridge
      # falls back to shadow on its own if it is gone. The env var says "may
      # be active"; the file says "is allowed to be". Delete the file to
      # disarm the room across restarts.
      MODE: active
      AUDIO_CHANNEL: raw
      HOP_MS: "320"
      OMP_NUM_THREADS: "1"
      OMP_WAIT_POLICY: PASSIVE
      OPENBLAS_NUM_THREADS: "1"
      TRIGGER_THRESHOLD: "0.5"
      # Quiet hours DISABLED 2026-08-25 (Brad): start == end never matches.
      # The 2 a.m. hands-full case matters more than a kid-proofing that
      # neither kid can trigger yet; bring back speaker-ID-gated, see backlog.
      QUIET_START: "00:00"
      QUIET_END: "00:00"
      TZ: America/Denver
      ESPhOME_SECRETS_FILE: /secrets/esphome.yaml
      API_KEY_NAME: voice_pe_api_key
      MODEL_PATHS: /models/okay_computer.onnx,/models/okay_google.onnx
      SILERO_MODEL: /models/silero_vad.onnx
      STOP_MODEL_PATH: /models/stop.onnx
      STOP_MODEL_ENABLED: "false"
      STOP_THRESHOLD: "0.5"
      STOP_REQUIRED_HITS: "2"
      # Simon empty-room rings scored as high as 0.925 with three consecutive
      # false hits. Do not permit model dismissal even if someone temporarily
      # re-enables scoring for diagnostics.
      STOP_DISMISS_ENABLED: "false"
      STOP_LOG_THRESHOLD: "0.2"
      STOP_HOP_MS: "224"
      # Same alarm-only rolling Parakeet listener proven on the Pi satellites.
      # It runs only while Simon's timer is ringing and needs no wake word.
      ALARM_ASR_CLIENT: kitchen-alarm
      ALARM_WINDOW_MS: "2500"
      ALARM_HOP_MS: "1000"
      DATA_DIR: /data
      ACTIVE_ARM_FILE: /data/routed-audio-armed
    volumes:
      - ./bridge/data:/data
      - /home/pi/backups/pw_pi-20260728/blobs:/models:ro
      - /home/pi/esphome/config/secrets.yaml:/secrets/esphome.yaml:ro

  claire-voice-bridge:
    build: ./bridge
    container_name: claire-voice-bridge
    network_mode: host
    restart: unless-stopped
    cpus: "1.5"
    # Twin of simon-voice-bridge for the second Voice PE (Claire's room,
    # 2026-08-25). Same image, same models, same safety shape: MODE=active
    # only takes effect while /data/routed-audio-armed exists in its OWN data
    # dir (bridge/data-claire), so the two rooms arm and disarm independently.
    environment:
      DEVICE_HOST: 192.168.30.60
      DEVICE_PORT: "6053"
      DEVICE_NAME: claire-voice-pe
      SATELLITE_ID: claire
      ORCH_BASE: http://127.0.0.1:8785
      HTTP_PORT: "8795"
      MODE: active
      AUDIO_CHANNEL: raw
      HOP_MS: "320"
      OMP_NUM_THREADS: "1"
      OMP_WAIT_POLICY: PASSIVE
      OPENBLAS_NUM_THREADS: "1"
      TRIGGER_THRESHOLD: "0.5"
      # Quiet hours DISABLED 2026-08-25 (Brad): start == end never matches.
      # The 2 a.m. hands-full case matters more than a kid-proofing that
      # neither kid can trigger yet; bring back speaker-ID-gated, see backlog.
      QUIET_START: "00:00"
      QUIET_END: "00:00"
      TZ: America/Denver
      ESPhOME_SECRETS_FILE: /secrets/esphome.yaml
      API_KEY_NAME: voice_pe_api_key
      MODEL_PATHS: /models/okay_computer.onnx,/models/okay_google.onnx
      SILERO_MODEL: /models/silero_vad.onnx
      STOP_MODEL_PATH: /models/stop.onnx
      # Same verdict as Simon's room: the marimba ring false-fires the stop
      # head, so timer dismissal is the alarm-only Parakeet listener.
      STOP_MODEL_ENABLED: "false"
      STOP_THRESHOLD: "0.5"
      STOP_REQUIRED_HITS: "2"
      STOP_DISMISS_ENABLED: "false"
      STOP_LOG_THRESHOLD: "0.2"
      STOP_HOP_MS: "224"
      ALARM_ASR_CLIENT: kitchen-alarm
      ALARM_WINDOW_MS: "2500"
      ALARM_HOP_MS: "1000"
      DATA_DIR: /data
      ACTIVE_ARM_FILE: /data/routed-audio-armed
    volumes:
      - ./bridge/data-claire:/data
      - /home/pi/backups/pw_pi-20260728/blobs:/models:ro
      - /home/pi/esphome/config/secrets.yaml:/secrets/esphome.yaml:ro
